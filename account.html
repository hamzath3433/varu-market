<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Account — Varu</title><link rel="stylesheet" href="css/styles.css" /></head>
<body>
<header class="appbar"><div class="wrap-wide"><a class="logo" href="index.html"><span class="logo-mark"></span> varu</a><div style="flex:1"></div><a class="btn btn-ghost" href="shop.html">Shop</a><button class="btn btn-ghost" onclick="Varu.logout()">Sign out</button></div></header>
<main class="wrap" style="padding:32px 0 80px"><h1>Household</h1><p class="muted" id="who"></p>
<div class="card" style="margin:18px 0"><p class="eyebrow">Home island</p><select class="field" id="island" style="margin-top:8px"></select></div>
<div class="grid-3" id="plans"></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
const u=Varu.currentUser(); if(!u) location.href="login.html";
document.getElementById("who").textContent=u.name+" · "+u.email;
Varu.fillIslandSelect(document.getElementById("island"),true);
document.getElementById("island").addEventListener("change",e=>{Varu.setIsland(e.target.value);Varu.toast("Island updated");});
document.getElementById("plans").innerHTML=Varu.state.plans.map(p=>`<article class="plan ${u.plan===p.id?"popular":""}"><p class="eyebrow">${p.name}</p><div class="price">${Varu.mvr(p.price)} <span>/ ${p.period}</span></div><button class="btn btn-lagoon btn-wide" onclick="u.plan='${p.id}';Varu.save();location.reload()">${u.plan===p.id?"Current plan":"Switch"}</button></article>`).join("");
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Varu admin</title><link rel="stylesheet" href="css/styles.css" /></head>
<body>
<div class="admin-layout">
<aside class="aside">
<a class="logo" href="index.html" style="color:#efe8d8;margin-bottom:20px;display:flex"><span class="logo-mark"></span> varu</a>
<button class="navbtn on" data-pane="islands">Islands</button>
<button class="navbtn" data-pane="plans">Subscriptions</button>
<button class="navbtn" data-pane="inbox">Contact inbox</button>
<button class="navbtn" data-pane="settings">Settings</button>
<button class="navbtn" onclick="Varu.logout()">Sign out</button>
</aside>
<main class="admin-main">
<section data-pane="islands"><h1>Islands</h1><table class="table" id="island-table"></table></section>
<section data-pane="plans" hidden><h1>Subscription fees</h1><div class="grid-3" id="plan-admin"></div></section>
<section data-pane="inbox" hidden><h1>Contact inbox</h1><div id="inbox-list"></div></section>
<section data-pane="settings" hidden><h1>Desk settings</h1><div class="card"><label>Master admin email</label><input class="field" id="admin-email" style="margin:8px 0" /><button class="btn btn-lagoon" onclick="Varu.setAdminEmail(document.getElementById('admin-email').value);Varu.toast('Saved')">Save address</button></div></section>
</main></div>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/mail.js"></script>
<script>
if(!Varu.requireAdmin()) throw 0;
document.querySelectorAll(".navbtn[data-pane]").forEach(btn=>btn.addEventListener("click",()=>{
document.querySelectorAll(".navbtn[data-pane]").forEach(b=>b.classList.remove("on"));btn.classList.add("on");
document.querySelectorAll("main [data-pane]").forEach(p=>p.hidden=p.dataset.pane!==btn.dataset.pane);
}));
function paint(){
document.getElementById("island-table").innerHTML="<tr><th>Island</th><th>Status</th><th></th></tr>"+Varu.state.islands.map(i=>`<tr><td>${i.name}</td><td>${i.status}</td><td>${i.status==="live"?`<button class='btn btn-ghost' onclick=\"const x=Varu.state.islands.find(z=>z.id==='${i.id}');x.status='paused';Varu.save();paint()\">Pause</button>`:`<button class='btn btn-ghost' onclick=\"const x=Varu.state.islands.find(z=>z.id==='${i.id}');x.status='live';Varu.save();paint()\">Make live</button>`}</td></tr>`).join("");
document.getElementById("plan-admin").innerHTML=Varu.state.plans.map(p=>`<article class="card"><p class="eyebrow">${p.name}</p><input class="field" type="number" value="${p.price}" onchange="Varu.setPlanPrice('${p.id}',this.value);Varu.toast('Fee saved')" /></article>`).join("");
const inbox=Varu.state.inbox||[];
document.getElementById("inbox-list").innerHTML=inbox.length?inbox.map(m=>`<article class="card" style="margin-bottom:8px"><strong>${m.subject}</strong><p class="muted small">${JSON.stringify(m.fields)}</p></article>`).join(""):"<p class='muted'>No notes yet.</p>";
document.getElementById("admin-email").value=(Varu.state.settings&&Varu.state.settings.adminEmail)||VARU_CONFIG.adminEmail;
}
paint();
</script></body></html>

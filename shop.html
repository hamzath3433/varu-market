<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — Varu</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="appbar"><div class="wrap-wide">
    <a class="logo" href="index.html"><span class="logo-mark"></span> varu</a>
    <label class="search"><input id="q" placeholder="Search rice, diapers, sunscreen…" /></label>
    <label class="island-switch">Island <select id="island"></select></label>
    <a class="btn btn-ghost" href="services.html">Services</a>
    <a class="btn btn-dark" href="cart.html">Basket <span data-cart-count>0</span></a>
    <a class="btn btn-ghost" id="acct" href="account.html">Account</a>
  </div></header>
  <main class="wrap-wide">
    <div style="padding:22px 0 8px"><p class="eyebrow" id="island-eyebrow">Your island</p><h1 id="island-title" style="font-size:36px">Shop</h1><p class="muted small" id="island-boat"></p></div>
    <div class="cats" id="cats"></div>
    <div class="product-grid" id="grid"></div>
  </main>
  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    let cat="all"; const cats=[["all","All aisles"],["groceries","Groceries"],["kids","Kids"],["beauty","Beauty"]];
    function paint(){
      const island=Varu.state.island, info=Varu.islandById(island);
      document.getElementById("island-title").textContent=info?info.name:"Shop";
      document.getElementById("island-boat").textContent=info?(info.status!=="live"?"Not taking orders yet.":info.boat):"";
      document.getElementById("cats").innerHTML=cats.map(([id,label])=>`<button class="cat ${cat===id?"on":""}" data-cat="${id}">${label}</button>`).join("");
      const list=(info&&info.status==="live")?Varu.productsFor(island,cat,document.getElementById("q").value):[];
      const u=Varu.currentUser();
      document.getElementById("grid").innerHTML=list.map(p=>{
        const st=Varu.stockOn(p,island), price=Varu.memberPrice(p), img=(VARU_IMG[p.img]||VARU_IMG.market);
        return `<article class="product"><div class="ph" style="background-image:url('${img}')"></div><div class="body"><div class="brand">${p.brand}</div><h3>${p.name}</h3><p class="muted small">${p.unit}</p><span class="chip ${st}">${st==="now"?"On island now":"Next supply boat"}</span><div style="font-weight:700;margin:6px 0">${Varu.mvr(price)}</div><button class="btn btn-lagoon" onclick="Varu.addToCart('${p.id}')">Add</button></div></article>`;
      }).join("")||`<p class="muted">Nothing in this aisle on this island yet.</p>`;
    }
    document.getElementById("cats").addEventListener("click",e=>{const b=e.target.closest("[data-cat]"); if(!b)return; cat=b.dataset.cat; paint();});
    document.getElementById("q").addEventListener("input",paint);
    const sel=document.getElementById("island"); Varu.fillIslandSelect(sel,true);
    sel.addEventListener("change",()=>{Varu.setIsland(sel.value); paint();});
    const user=Varu.currentUser(); document.getElementById("acct").textContent=user?user.name.split(" ")[0]:"Sign in";
    if(!user) document.getElementById("acct").href="login.html";
    paint();
  </script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Basket — Varu</title><link rel="stylesheet" href="css/styles.css" /></head>
<body>
<header class="appbar"><div class="wrap-wide"><a class="logo" href="index.html"><span class="logo-mark"></span> varu</a><div style="flex:1"></div><a class="btn btn-ghost" href="shop.html">Keep shopping</a></div></header>
<main class="wrap" style="padding:32px 0 80px">
<h1 style="font-size:34px;margin-bottom:16px">Basket</h1>
<div id="lines"></div>
<div class="card" style="margin-top:18px;max-width:420px">
<p class="eyebrow">Deliver to</p><h3 id="where"></h3>
<div style="display:flex;justify-content:space-between;margin-top:12px"><span>Total</span><strong id="tot"></strong></div>
<button class="btn btn-lagoon btn-wide" style="margin-top:18px" onclick="checkout()">Place order</button>
<p class="hint" id="gate"></p>
</div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
function paint(){const island=Varu.islandById(Varu.state.island);document.getElementById("where").textContent=island?island.name:"—";document.getElementById("lines").innerHTML=Varu.state.cart.map(c=>{const p=VARU_SEED.products.find(x=>x.id===c.id);if(!p)return"";return `<div class="card" style="margin-bottom:10px"><strong>${p.name}</strong> × ${c.qty}<div class="muted small">${Varu.mvr(Varu.memberPrice(p))}</div></div>`;}).join("")||`<p class="muted">Basket is empty.</p>`;document.getElementById("tot").textContent=Varu.mvr(Varu.cartTotal());const u=Varu.currentUser();document.getElementById("gate").textContent=!u?"Sign in to place the order.":(u.plan?"Pay on delivery.":"Membership required.");}
function checkout(){const u=Varu.currentUser();if(!u)return location.href="login.html";if(!u.plan)return location.href="account.html";if(!Varu.state.cart.length)return Varu.toast("Basket is empty");Varu.state.cart=[];Varu.save();Varu.toast("Order placed");paint();}
paint();
</script></body></html>
